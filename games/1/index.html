<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Neon Snake Remix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0d0d2b;
            border: 3px solid #0ff;
            border-radius: 8px;
            box-shadow: 0 0 20px #0ff, inset 0 0 20px #0ff3;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            pointer-events: none;
        }
        #score-board {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #0ff;
            border-radius: 6px;
            padding: 6px 12px;
            color: #0ff;
            text-shadow: 0 0 8px #0ff;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            pointer-events: none;
        }
        #lang-btn {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #0ff;
            border-radius: 6px;
            color: #0ff;
            text-shadow: 0 0 8px #0ff;
            font-size: 20px;
            padding: 4px 10px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        #lang-btn:hover { background: #0ff2; box-shadow: 0 0 15px #0ff; }
        #bottom-bar {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            pointer-events: none;
        }
        #message {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0ff;
            border-radius: 8px;
            padding: 12px 24px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
            display: none;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        #mobile-controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: none;
            pointer-events: auto;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 6px;
            z-index: 10;
        }
        .ctrl-btn {
            background: rgba(0, 255, 255, 0.15);
            border: 2px solid #0ff;
            border-radius: 10px;
            color: #0ff;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            text-shadow: 0 0 8px #0ff;
            transition: background 0.1s;
        }
        .ctrl-btn:active { background: rgba(0, 255, 255, 0.5); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
        @media (pointer: coarse) {
            #mobile-controls { display: grid; }
        }
        @media (max-width: 500px) {
            #score-board { font-size: 14px; padding: 4px 8px; }
            #lang-btn { font-size: 16px; padding: 3px 8px; }
            #message { font-size: 16px; padding: 8px 16px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div id="top-bar">
                <div id="score-board"><span id="score-label">Score</span>: <span id="score-value">0</span></div>
                <button id="lang-btn" onclick="toggleLang()">🇬🇧/🇷🇺</button>
            </div>
            <div id="bottom-bar">
                <div id="message"></div>
            </div>
        </div>
        <div id="mobile-controls">
            <div class="ctrl-btn" id="btn-up" ontouchstart="handleTouch('up', event)" ontouchend="preventDefault(event)">▲</div>
            <div class="ctrl-btn" id="btn-left" ontouchstart="handleTouch('left', event)" ontouchend="preventDefault(event)">◀</div>
            <div class="ctrl-btn" id="btn-right" ontouchstart="handleTouch('right', event)" ontouchend="preventDefault(event)">▶</div>
            <div class="ctrl-btn" id="btn-down" ontouchstart="handleTouch('down', event)" ontouchend="preventDefault(event)">▼</div>
        </div>
    </div>
    <script>
        // ===== I18N =====
        const i18n = {
            en: {
                title: "Neon Snake Remix",
                score: "Score",
                best: "Best",
                play: "Play",
                gameover: "Game Over",
                restart: "Tap or Press Space to Restart",
                pause: "Pause",
                tapToStart: "Tap or Press Space to Start",
                paused: "Paused"
            },
            ru: {
                title: "Неоновый Змейка Ремикс",
                score: "Счёт",
                best: "Рекорд",
                play: "Играть",
                gameover: "Игра окончена",
                restart: "Тап или Пробел для рестарта",
                pause: "Пауза",
                tapToStart: "Тап или Пробел для старта",
                paused: "Пауза"
            }
        };

        function getLang() { return localStorage.getItem('game_lang') || 'en'; }
        function setLang(l) { localStorage.setItem('game_lang', l); renderUI(); }
        function t(key) { return i18n[getLang()][key] || i18n.en[key] || key; }
        function toggleLang() { setLang(getLang() === 'en' ? 'ru' : 'en'); }

        // ===== GAME SETUP =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreLabel = document.getElementById('score-label');
        const scoreValue = document.getElementById('score-value');
        const messageEl = document.getElementById('message');

        // Grid settings
        const GRID_SIZE = 20; // 20x20 grid
        let cellSize;

        // Game state
        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = { x: 0, y: 0 };
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('snake_best') || '0');
        let gameState = 'start'; // 'start', 'playing', 'gameover', 'paused'
        let speed = 150; // ms per move
        let lastMoveTime = 0;
        let particles = [];
        let screenShake = 0;
        let foodPulse = 0;
        let snakeGlow = 0;

        // Colors
        const COLORS = {
            bg: '#0d0d2b',
            grid: '#1a1a4a',
            snakeHead: '#0ff',
            snakeBody: '#0aa',
            snakeGlow: '#0ff',
            food: '#f0f',
            foodGlow: '#f0f',
            particle: '#0ff',
            text: '#0ff'
        };

        // ===== RESIZE CANVAS =====
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const size = Math.min(container.clientWidth, container.clientHeight);
            canvas.width = size;
            canvas.height = size;
            cellSize = canvas.width / GRID_SIZE;
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            draw();
        });

        // ===== INIT GAME =====
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            speed = 150;
            particles = [];
            screenShake = 0;
            foodPulse = 0;
            snakeGlow = 0;
            spawnFood();
            updateScoreDisplay();
        }

        function spawnFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
            } while (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
            food = newFood;
            foodPulse = 0;
        }

        function updateScoreDisplay() {
            scoreLabel.textContent = t('score');
            scoreValue.textContent = score;
        }

        // ===== GAME LOGIC =====
        function moveSnake() {
            if (gameState !== 'playing') return;

            // Apply next direction
            direction = { ...nextDirection };

            const head = { ...snake[0] };
            head.x += direction.x;
            head.y += direction.y;

            // Check wall collision
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver();
                return;
            }

            // Check self collision
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScoreDisplay();
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('snake_best', bestScore.toString());
                }
                spawnFood();
                // Speed up slightly
                speed = Math.max(60, speed - 2);
                // Particles
                spawnParticles(food.x, food.y);
                screenShake = 6;
                snakeGlow = 1;
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            gameState = 'gameover';
            screenShake = 12;
            spawnParticles(snake[0].x, snake[0].y, 20);
            showMessage(t('gameover') + '\n' + t('restart'));
        }

        function spawnParticles(gx, gy, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: (gx + 0.5) * cellSize,
                    y: (gy + 0.5) * cellSize,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1,
                    size: Math.random() * 4 + 2,
                    color: Math.random() > 0.5 ? '#0ff' : '#f0f'
                });
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt * 0.06;
                p.y += p.vy * dt * 0.06;
                p.life -= dt * 0.002;
                p.vy += dt * 0.01; // gravity
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function showMessage(text) {
            messageEl.textContent = text;
            messageEl.style.display = 'block';
        }

        function hideMessage() {
            messageEl.style.display = 'none';
        }

        // ===== DRAWING =====
        function draw() {
            ctx.save();

            // Screen shake
            if (screenShake > 0) {
                const shakeX = (Math.random() - 0.5) * screenShake;
                const shakeY = (Math.random() - 0.5) * screenShake;
                ctx.translate(shakeX, shakeY);
                screenShake *= 0.9;
                if (screenShake < 0.5) screenShake = 0;
            }

            // Clear
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);

            // Grid lines
            ctx.strokeStyle = COLORS.grid;
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(canvas.width, i * cellSize);
                ctx.stroke();
            }

            // Draw food with glow and pulse
            const pulseScale = 1 + Math.sin(foodPulse) * 0.15;
            const fx = (food.x + 0.5) * cellSize;
            const fy = (food.y + 0.5) * cellSize;
            ctx.shadowColor = COLORS.foodGlow;
            ctx.shadowBlur = 15 + Math.sin(foodPulse) * 5;
            ctx.fillStyle = COLORS.food;
            ctx.beginPath();
            ctx.arc(fx, fy, (cellSize * 0.35) * pulseScale, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw snake
            for (let i = snake.length - 1; i >= 0; i--) {
                const seg = snake[i];
                const x = seg.x * cellSize;
                const y = seg.y * cellSize;
                const isHead = i === 0;

                if (isHead) {
                    ctx.shadowColor = COLORS.snakeGlow;
                    ctx.shadowBlur = 20 + snakeGlow * 15;
                    ctx.fillStyle = COLORS.snakeHead;
                } else {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = COLORS.snakeBody;
                    const alpha = 1 - (i / snake.length) * 0.5;
                    ctx.fillStyle = `rgba(0, 170, 170, ${alpha})`;
                }

                const padding = isHead ? 1 : 2;
                ctx.beginPath();
                ctx.roundRect(x + padding, y + padding, cellSize - padding * 2, cellSize - padding * 2, isHead ? 6 : 4);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Eyes on head
                if (isHead) {
                    ctx.fillStyle = '#000';
                    const eyeSize = cellSize * 0.15;
                    const eyeOffset = cellSize * 0.25;
                    let ex1, ey1, ex2, ey2;
                    if (direction.x === 1) {
                        ex1 = x + cellSize - eyeOffset; ey1 = y + eyeOffset;
                        ex2 = x + cellSize - eyeOffset; ey2 = y + cellSize - eyeOffset;
                    } else if (direction.x === -1) {
                        ex1 = x + eyeOffset; ey1 = y + eyeOffset;
                        ex2 = x + eyeOffset; ey2 = y + cellSize - eyeOffset;
                    } else if (direction.y === -1) {
                        ex1 = x + eyeOffset; ey1 = y + eyeOffset;
                        ex2 = x + cellSize - eyeOffset; ey2 = y + eyeOffset;
                    } else {
                        ex1 = x + eyeOffset; ey1 = y + cellSize - eyeOffset;
                        ex2 = x + cellSize - eyeOffset; ey2 = y + cellSize - eyeOffset;
                    }
                    ctx.beginPath();
                    ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Draw particles
            for (const p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // Draw start screen overlay
            if (gameState === 'start') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = COLORS.text;
                ctx.shadowColor = COLORS.text;
                ctx.shadowBlur = 20;
                ctx.font = `bold ${Math.min(canvas.width * 0.08, 40)}px 'Courier New', monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t('title'), canvas.width / 2, canvas.height * 0.35);
                ctx.font = `${Math.min(canvas.width * 0.05, 24)}px 'Courier New', monospace`;
                ctx.fillText(t('tapToStart'), canvas.width / 2, canvas.height * 0.55);
                ctx.font = `${Math.min(canvas.width * 0.04, 18)}px 'Courier New', monospace`;
                ctx.fillText(t('best') + ': ' + bestScore, canvas.width / 2, canvas.height * 0.7);
                ctx.shadowBlur = 0;
            }

            // Draw pause overlay
            if (gameState === 'paused') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = COLORS.text;
                ctx.shadowColor = COLORS.text;
                ctx.shadowBlur = 20;
                ctx.font = `bold ${Math.min(canvas.width * 0.1, 50)}px 'Courier New', monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t('paused'), canvas.width / 2, canvas.height / 2);
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        // ===== GAME LOOP =====
        let lastTime = 0;
        function gameLoop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            if (gameState === 'playing') {
                lastMoveTime += dt;
                if (lastMoveTime >= speed) {
                    lastMoveTime = 0;
                    moveSnake();
                }
                foodPulse += dt * 0.005;
                if (snakeGlow > 0) snakeGlow -= dt * 0.003;
            }

            updateParticles(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ===== INPUT HANDLING =====
        function setDirection(dir) {
            if (gameState === 'start') {
                startGame();
                return;
            }
            if (gameState === 'gameover') {
                restartGame();
                return;
            }
            if (gameState !== 'playing') return;

            const dirMap = {
                up: { x: 0, y: -1 },
                down: { x: 0, y: 1 },
                left: { x: -1, y: 0 },
                right: { x: 1, y: 0 }
            };
            const newDir = dirMap[dir];
            // Prevent 180-degree turns
            if (newDir.x !== -direction.x || newDir.y !== -direction.y) {
                nextDirection = newDir;
            }
        }

        function handleTouch(dir, event) {
            event.preventDefault();
            setDirection(dir);
        }

        function preventDefault(e) {
            e.preventDefault();
        }

        // Keyboard
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'arrowup' || key === 'w') { e.preventDefault(); setDirection('up'); }
            else if (key === 'arrowdown' || key === 's') { e.preventDefault(); setDirection('down'); }
            else if (key === 'arrowleft' || key === 'a') { e.preventDefault(); setDirection('left'); }
            else if (key === 'arrowright' || key === 'd') { e.preventDefault(); setDirection('right'); }
            else if (key === ' ' || key === 'enter') {
                e.preventDefault();
                if (gameState === 'start') startGame();
                else if (gameState === 'gameover') restartGame();
                else if (gameState === 'playing') { gameState = 'paused'; showMessage(t('paused')); }
                else if (gameState === 'paused') { gameState = 'playing'; hideMessage(); }
            }
            else if (key === 'p' || key === 'escape') {
                e.preventDefault();
                if (gameState === 'playing') { gameState = 'paused'; showMessage(t('paused')); }
                else if (gameState === 'paused') { gameState = 'playing'; hideMessage(); }
            }
        });

        // Touch swipe on canvas
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);
            const minSwipe = 20;

            if (Math.max(absDx, absDy) < minSwipe) {
                // Tap
                if (gameState === 'start') startGame();
                else if (gameState === 'gameover') restartGame();
                else if (gameState === 'paused') { gameState = 'playing'; hideMessage(); }
                return;
            }

            if (absDx > absDy) {
                setDirection(dx > 0 ? 'right' : 'left');
            } else {
                setDirection(dy > 0 ? 'down' : 'up');
            }
        }, { passive: false });

        // Prevent default on touchmove to stop scrolling
        document.addEventListener('touchmove', (e) => {
            if (e.target === canvas) e.preventDefault();
        }, { passive: false });

        // ===== GAME CONTROL =====
        function startGame() {
            initGame();
            gameState = 'playing';
            hideMessage();
            lastMoveTime = 0;
        }

        function restartGame() {
            startGame();
        }

        function renderUI() {
            updateScoreDisplay();
            if (gameState === 'start') {
                // Message handled in draw
            } else if (gameState === 'gameover') {
                showMessage(t('gameover') + '\n' + t('restart'));
            } else if (gameState === 'paused') {
                showMessage(t('paused'));
            } else {
                hideMessage();
            }
        }

        // ===== INIT =====
        resizeCanvas();
        initGame();
        gameState = 'start';
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
