<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Detective Mystery · Silent Shadows</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; touch-action: none;
      background: #0a0a0f;
      font-family: 'Courier New', monospace;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
    #game-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
    }
  </style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>
</div>
<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ---------- FULLSCREEN RESIZE ----------
    let W, H;
    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
      ctx.imageSmoothingEnabled = false;
    }
    window.addEventListener('resize', resize);
    resize();

    // ---------- GAME STATE ----------
    const STATE = {
      MENU: 0,
      EXPLORE: 1,
      INTERROGATE: 2,
      DEDUCTION: 3,
      GAMEOVER: 4,
      VICTORY: 5
    };

    let state = STATE.MENU;

    // Clues & suspects
    const clues = [
      { id: 'c1', name: 'Broken watch', desc: 'Stopped at 2:15 AM.', found: false, icon: '⌚' },
      { id: 'c2', name: 'Bloody glove', desc: 'Right hand, size L.', found: false, icon: '🧤' },
      { id: 'c3', name: 'Threatening note', desc: '"You will pay."', found: false, icon: '📝' },
      { id: 'c4', name: 'Hotel keycard', desc: 'Room 214.', found: false, icon: '🔑' },
      { id: 'c5', name: 'Cigar ash', desc: 'Unusual blend.', found: false, icon: '🚬' }
    ];

    const suspects = [
      { name: 'Viktor', alibi: 'At bar until 3 AM', guilty: false, clueMatch: 'c5' },
      { name: 'Elena', alibi: 'Sleeping in room 214', guilty: true, clueMatch: 'c4' },
      { name: 'Marcus', alibi: 'Walking alone', guilty: false, clueMatch: 'c2' },
      { name: 'Rosa', alibi: 'In kitchen preparing', guilty: false, clueMatch: 'c3' }
    ];

    let selectedClue = null;
    let interrogationSuspect = null;
    let dialogueLines = [];
    let dialogueIndex = 0;
    let showDialogue = false;
    let lastTapTime = 0;

    // Parallax layers positions (pseudo-3D)
    let bgOffset = 0;
    let midOffset = 0;
    let fgOffset = 0;

    // Particles
    let particles = [];
    function spawnParticles(x, y, count, color) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 3,
          vy: (Math.random() - 0.5) * 3 - 1,
          life: 0.8 + Math.random() * 0.5,
          maxLife: 1.0,
          size: 2 + Math.random() * 3,
          color: color || '#c9a87c'
        });
      }
    }

    // ---------- INITIAL CLUES ----------
    function collectAllClues() {
      clues.forEach(c => c.found = true);
    }

    // ---------- DIALOGUE SYSTEM ----------
    const dialogues = {
      intro: [
        "Detective, the victim was found in the hotel lobby.",
        "Four suspects. Five clues. Find the truth.",
        "Tap on glowing objects to collect evidence.",
        "Then interrogate suspects to match clues."
      ],
      viktor: [
        "Viktor: I was at the bar, ask anyone.",
        "You notice cigar ash on his sleeve.",
        "He avoids eye contact when you mention the time."
      ],
      elena: [
        "Elena: I was in my room, sleeping.",
        "A hotel keycard slips from her pocket.",
        "Room 214 — that's the victim's room number."
      ],
      marcus: [
        "Marcus: I needed fresh air, so I walked.",
        "His right hand is bandaged.",
        "The bloody glove was size L — his size."
      ],
      rosa: [
        "Rosa: I was in the kitchen all night.",
        "She smells of expensive cigars.",
        "A threatening note is tucked in her apron."
      ]
    };

    // ---------- INTERACTION ----------
    function handleTap(x, y) {
      const now = Date.now();
      const isDoubleTap = (now - lastTapTime) < 300;
      lastTapTime = now;

      if (state === STATE.MENU) {
        state = STATE.EXPLORE;
        spawnParticles(W/2, H/2, 30, '#d4af37');
        dialogueLines = dialogues.intro;
        dialogueIndex = 0;
        showDialogue = true;
        return;
      }

      if (state === STATE.EXPLORE) {
        // Check clue hotspots
        const cluePositions = getCluePositions();
        for (let i = 0; i < clues.length; i++) {
          const pos = cluePositions[i];
          if (!clues[i].found && Math.hypot(x - pos.x, y - pos.y) < 50) {
            clues[i].found = true;
            spawnParticles(pos.x, pos.y, 20, '#ffd966');
            dialogueLines = [`Found: ${clues[i].name}`, clues[i].desc];
            dialogueIndex = 0;
            showDialogue = true;
            // Check if all clues found
            if (clues.every(c => c.found)) {
              dialogueLines = ["All clues collected!", "Now interrogate suspects. Tap on them."];
              dialogueIndex = 0;
            }
            return;
          }
        }

        // Check suspect hotspots
        const suspectPositions = getSuspectPositions();
        for (let i = 0; i < suspects.length; i++) {
          const pos = suspectPositions[i];
          if (Math.hypot(x - pos.x, y - pos.y) < 55) {
            state = STATE.INTERROGATE;
            interrogationSuspect = suspects[i];
            dialogueLines = dialogues[suspects[i].name.toLowerCase()];
            dialogueIndex = 0;
            showDialogue = true;
            spawnParticles(pos.x, pos.y, 15, '#8b5cf6');
            return;
          }
        }
      }

      if (state === STATE.INTERROGATE) {
        if (showDialogue) {
          dialogueIndex++;
          if (dialogueIndex >= dialogueLines.length) {
            showDialogue = false;
            // Check if player can accuse
          }
        } else {
          // Accuse button area
          if (y > H * 0.82 && y < H * 0.92 && x > W * 0.3 && x < W * 0.7) {
            if (interrogationSuspect.guilty) {
              state = STATE.VICTORY;
              spawnParticles(W/2, H/2, 60, '#ffd700');
            } else {
              state = STATE.GAMEOVER;
            }
          }
          // Back button
          if (y > H * 0.92 && x < W * 0.3) {
            state = STATE.EXPLORE;
            interrogationSuspect = null;
          }
        }
      }

      if (state === STATE.GAMEOVER || state === STATE.VICTORY) {
        // Reset
        state = STATE.MENU;
        clues.forEach(c => c.found = false);
        interrogationSuspect = null;
        showDialogue = false;
      }
    }

    function getCluePositions() {
      return [
        { x: W * 0.12, y: H * 0.25 },
        { x: W * 0.30, y: H * 0.55 },
        { x: W * 0.50, y: H * 0.20 },
        { x: W * 0.72, y: H * 0.60 },
        { x: W * 0.88, y: H * 0.35 }
      ];
    }

    function getSuspectPositions() {
      return [
        { x: W * 0.18, y: H * 0.78 },
        { x: W * 0.40, y: H * 0.78 },
        { x: W * 0.62, y: H * 0.78 },
        { x: W * 0.84, y: H * 0.78 }
      ];
    }

    // ---------- TOUCH HANDLERS ----------
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (e.touches.length > 0) {
        handleTap(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      // Parallax based on touch movement
      if (e.touches.length > 0) {
        const dx = e.touches[0].clientX - W / 2;
        bgOffset = dx * 0.02;
        midOffset = dx * 0.05;
        fgOffset = dx * 0.08;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
    }, { passive: false });

    // Keyboard support
    window.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleTap(W/2, H/2);
      }
      if (e.key === 'ArrowLeft') { bgOffset -= 5; midOffset -= 8; fgOffset -= 12; }
      if (e.key === 'ArrowRight') { bgOffset += 5; midOffset += 8; fgOffset += 12; }
    });

    // Mouse fallback
    canvas.addEventListener('click', e => {
      handleTap(e.clientX, e.clientY);
    });

    // ---------- RENDERING ----------
    function drawBackground() {
      // Sky gradient
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#0a0a1a');
      grad.addColorStop(0.4, '#1a1a2e');
      grad.addColorStop(0.7, '#2d1b3d');
      grad.addColorStop(1, '#1a0f1a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Stars
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      for (let i = 0; i < 50; i++) {
        const sx = (i * 137 + bgOffset * 0.5) % W;
        const sy = (i * 89) % (H * 0.5);
        ctx.fillRect(sx, sy, 1, 1);
      }
    }

    function drawMidground() {
      // Buildings silhouette
      ctx.fillStyle = '#1a1a2e';
      for (let i = 0; i < 8; i++) {
        const bx = i * (W / 7) + midOffset * 0.5;
        const bh = H * (0.25 + (i % 3) * 0.08);
        ctx.fillRect(bx, H * 0.45 - bh, W / 9, bh);
        // Windows
        ctx.fillStyle = 'rgba(255,200,100,0.15)';
        for (let wy = 0; wy < 5; wy++) {
          for (let wx = 0; wx < 3; wx++) {
            if ((i + wy + wx) % 3 === 0) {
              ctx.fillRect(bx + 8 + wx * 12, H * 0.45 - bh + 10 + wy * 15, 5, 7);
            }
          }
        }
        ctx.fillStyle = '#1a1a2e';
      }

      // Ground / street
      ctx.fillStyle = '#0d0d15';
      ctx.fillRect(0, H * 0.45, W, H * 0.55);

      // Cobblestone pattern
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 20; i++) {
        const y = H * 0.45 + i * 30;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }
    }

    function drawForeground() {
      // Fog/mist effect
      const fogGrad = ctx.createLinearGradient(0, H * 0.4, 0, H);
      fogGrad.addColorStop(0, 'rgba(100,80,140,0.1)');
      fogGrad.addColorStop(1, 'rgba(20,10,30,0.4)');
      ctx.fillStyle = fogGrad;
      ctx.fillRect(0, H * 0.4, W, H * 0.6);
    }

    function drawClues() {
      const positions = getCluePositions();
      clues.forEach((clue, i) => {
        if (clue.found) return;
        const pos = positions[i];
        const pulse = Math.sin(Date.now() * 0.003 + i) * 0.3 + 0.7;

        // Glow
        ctx.shadowColor = '#ffd966';
        ctx.shadowBlur = 20 * pulse;
        ctx.fillStyle = `rgba(255,217,102,${0.3 * pulse})`;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 25, 0, Math.PI * 2);
        ctx.fill();

        // Icon
        ctx.shadowBlur = 0;
        ctx.font = '28px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffd966';
        ctx.fillText(clue.icon, pos.x, pos.y);
      });
    }

    function drawSuspects() {
      const positions = getSuspectPositions();
      suspects.forEach((suspect, i) => {
        const pos = positions[i];
        const bob = Math.sin(Date.now() * 0.002 + i * 1.5) * 3;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y + 35, 25, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Body
        ctx.fillStyle = ['#5a3e2b', '#2b3e5a', '#3e5a2b', '#5a2b3e'][i];
        ctx.fillRect(pos.x - 18, pos.y + bob - 10, 36, 40);

        // Head
        ctx.fillStyle = '#d4a574';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 20 + bob, 15, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.arc(pos.x - 5, pos.y - 22 + bob, 2, 0, Math.PI * 2);
        ctx.arc(pos.x + 5, pos.y - 22 + bob, 2, 0, Math.PI * 2);
        ctx.fill();

        // Name tag
        ctx.font = '11px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillText(suspect.name, pos.x, pos.y + 55);
      });
    }

    function drawHUD() {
      // Clue counter
      const found = clues.filter(c => c.found).length;
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#c9a87c';
      ctx.fillText(`🔍 Clues: ${found}/${clues.length}`, 20, 30);

      // Title
      ctx.textAlign = 'center';
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.fillStyle = 'rgba(201,168,124,0.6)';
      ctx.fillText('SILENT SHADOWS', W/2, 30);

      // Back button in interrogate
      if (state === STATE.INTERROGATE) {
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#8b5cf6';
        ctx.fillRect(W * 0.3, H * 0.82, W * 0.4, H * 0.08);
        ctx.fillStyle = '#fff';
        ctx.fillText('ACCUSE', W/2, H * 0.87);

        ctx.fillStyle = '#555';
        ctx.fillRect(W * 0.05, H * 0.92, W * 0.2, H * 0.05);
        ctx.fillStyle = '#aaa';
        ctx.font = '12px "Courier New", monospace';
        ctx.fillText('BACK', W * 0.15, H * 0.95);
      }
    }

    function drawDialogue() {
      if (!showDialogue || dialogueIndex >= dialogueLines.length) return;

      const boxH = H * 0.18;
      const boxY = H - boxH - 20;

      // Dialogue box
      ctx.fillStyle = 'rgba(10,10,20,0.9)';
      ctx.strokeStyle = '#c9a87c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(20, boxY, W - 40, boxH, 8);
      ctx.fill();
      ctx.stroke();

      // Text
      ctx.font = '14px "Courier New", monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#e8d5b7';
      const text = dialogueLines[dialogueIndex];
      wrapText(text, 35, boxY + 20, W - 70, 20);

      // Tap hint
      ctx.font = '10px "Courier New", monospace';
      ctx.fillStyle = 'rgba(201,168,124,0.5)';
      ctx.textAlign = 'right';
      ctx.fillText('tap to continue', W - 35, boxY + boxH - 15);
    }

    function wrapText(text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let currentY = y;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, currentY);
          line = words[n] + ' ';
          currentY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, currentY);
    }

    function drawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life -= 0.016;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawMenu() {
      drawBackground();
      drawMidground();
      drawForeground();

      // Title
      ctx.font = 'bold 36px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Glow effect
      ctx.shadowColor = '#d4af37';
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#d4af37';
      ctx.fillText('SILENT SHADOWS', W/2, H * 0.3);
      ctx.shadowBlur = 0;

      ctx.font = '16px "Courier New", monospace';
      ctx.fillStyle = '#c9a87c';
      ctx.fillText('A Detective Mystery', W/2, H * 0.4);

      // Pulsing tap prompt
      const pulse = Math.sin(Date.now() * 0.004) * 0.3 + 0.7;
      ctx.globalAlpha = pulse;
      ctx.font = '18px "Courier New", monospace';
      ctx.fillStyle = '#ffd966';
      ctx.fillText('TAP TO BEGIN', W/2, H * 0.65);
      ctx.globalAlpha = 1;
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0, 0, W, H);

      ctx.font = 'bold 32px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#e74c3c';
      ctx.shadowColor = '#e74c3c';
      ctx.shadowBlur = 20;
      ctx.fillText('WRONG ACCUSATION', W/2, H * 0.35);
      ctx.shadowBlur = 0;

      ctx.font = '16px "Courier New", monospace';
      ctx.fillStyle = '#aaa';
      ctx.fillText('The real killer escaped...', W/2, H * 0.5);

      const pulse = Math.sin(Date.now() * 0.004) * 0.3 + 0.7;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#ffd966';
      ctx.font = '18px "Courier New", monospace';
      ctx.fillText('TAP TO RETRY', W/2, H * 0.7);
      ctx.globalAlpha = 1;
    }

    function drawVictory() {
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0, 0, W, H);

      ctx.font = 'bold 36px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffd700';
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 30;
      ctx.fillText('CASE CLOSED', W/2, H * 0.3);
      ctx.shadowBlur = 0;

      ctx.font = '16px "Courier New", monospace';
      ctx.fillStyle = '#e8d5b7';
      ctx.fillText('Elena was the killer.', W/2, H * 0.45);
      ctx.fillText('The keycard gave her away.', W/2, H * 0.52);

      const pulse = Math.sin(Date.now() * 0.004) * 0.3 + 0.7;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#ffd966';
      ctx.font = '18px "Courier New", monospace';
      ctx.fillText('TAP TO PLAY AGAIN', W/2, H * 0.7);
      ctx.globalAlpha = 1;
    }

    // RoundRect polyfill
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
      };
    }

    // ---------- MAIN LOOP ----------
    function gameLoop() {
      ctx.clearRect(0, 0, W, H);

      if (state === STATE.MENU) {
        drawMenu();
      } else if (state === STATE.EXPLORE) {
        drawBackground();
        drawMidground();
        drawForeground();
        drawClues();
        drawSuspects();
        drawHUD();
        drawDialogue();
        drawParticles();
      } else if (state === STATE.INTERROGATE) {
        drawBackground();
        drawMidground();
        drawForeground();

        // Dim scene
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);

        // Suspect portrait
        if (interrogationSuspect) {
          const cx = W/2, cy = H * 0.35;
          ctx.fillStyle = '#1a1a2e';
          ctx.beginPath();
          ctx.arc(cx, cy, 80, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#8b5cf6';
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.font = '60px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('🕵️', cx, cy);

          ctx.font = 'bold 20px "Courier New", monospace';
          ctx.fillStyle = '#c9a87c';
          ctx.fillText(interrogationSuspect.name, cx, cy + 110);
        }

        drawDialogue();
        drawHUD();
        drawParticles();
      } else if (state === STATE.GAMEOVER) {
        drawGameOver();
      } else if (state === STATE.VICTORY) {
        drawVictory();
      }

      requestAnimationFrame(gameLoop);
    }

    // Start
    requestAnimationFrame(gameLoop);
  })();
</script>
</body>
</html>
