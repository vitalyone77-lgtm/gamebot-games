<script>
(function(){
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=256,H=224;

// ---------- Input ----------
const keys={};
let tapQueue=[];
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  keys[e.key.toLowerCase()]=true;
  if(e.key==='Enter'||e.key===' '){tapQueue.push({x:-1,y:-1,key:true});}
  if(e.key==='Escape'){toggleMenu();}
},{passive:false});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function getPos(ev){
  const r=cv.getBoundingClientRect();
  const t=ev.touches?ev.touches[0]:ev;
  return {x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height)};
}
cv.addEventListener('mousedown',e=>{const p=getPos(e);tapQueue.push(p);});
cv.addEventListener('touchstart',e=>{e.preventDefault();const p=getPos(e);tapQueue.push(p);},{passive:false});

// ---------- Audio (tiny synth) ----------
let AC=null;
function beep(freq,dur,type,vol){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.value=freq;
    g.gain.value=vol||0.04;
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}

// ---------- Palette ----------
const C={
  bg0:'#05070a', bg1:'#0a1016', bg2:'#121c24',
  iron0:'#1c2830', iron1:'#2a3a44', iron2:'#3e5460',
  water0:'#0d1a22', water1:'#16303c', water2:'#1e4a5a',

// ---------- Game State ----------
const G={

// ---------- Seals definition ----------
const SEALS=[
  {id:0,name:'SEAL I — THE LOCKER',type:'pattern',

// ---------- Dialogue Scripts ----------
const SCRIPTS={
  intro:[
    {who:'???',text:'...water. Cold iron. Your lungs burn.'},
    {who:'???',text:'You open your eyes. Darkness. A dim amber light pulses ahead.'},

// ---------- Particles ----------
function spawnParticle(x,y,color,vx,vy,life){
  G.particles.push({x,y,vx:vx||0,vy:vy||0,life:life||30,maxLife:life||30,color});
}
function burst(x,y,color,n){
  for(let i=0;i<(n||8);i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*1.5+0.3;
    spawnParticle(x,y,color,Math.cos(a)*s,Math.sin(a)*s,20+Math.random()*20);
  }
}

// ---------- Screen transitions ----------
function goScene(s){
  G.prevScene=G.scene;
  G.scene=s;
  G.transition=1;
}

// ---------- Dialogue ----------
function startDialogue(key,onEnd){
  G.dialogue=SCRIPTS[key].slice();
  G.dialogueIndex=0;
  G.dialogueChars=0;
  G.dialogueEnd=onEnd||null;
  G.prevScene=G.scene;
  G.scene='dialogue';
  G.choiceIndex=0;
}
function advanceDialogue(){
  if(!G.dialogue)return;
  const line=G.dialogue[G.dialogueIndex];
  if(G.dialogueChars<line.text.length){
    G.dialogueChars=line.text.length;
    return;
  }
  G.dialogueIndex++;
  G.dialogueChars=0;
  if(G.dialogueIndex>=G.dialogue.length){
    const cb=G.dialogueEnd;
    G.dialogue=null;G.dialogueEnd=null;
    if(cb)cb();else goScene(G.prevScene||'hub');
  }
}

// ---------- Text wrapping ----------
function wrapText(text,maxChars){
  const words=text.split(' ');const lines=[];let cur='';
  for(const w of words){
    if((cur+' '+w).trim().length>maxChars){lines.push(cur);cur=w;}
    else cur=(cur+' '+w).trim();
  }
  if(cur)lines.push(cur);
  return lines;
}

// ---------- Pixel font (built-in via canvas) ----------
function text(str,x,y,color,size){
  ctx.fillStyle=color||C.white;
  ctx.font=(size||8)+'px monospace';
  ctx.textAlign='left';
  ctx.textBaseline='top';
  ctx.fillText(str,x,y);
}

// ---------- Drawing helpers ----------
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0);}
function px(x,y,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,1,1);}

function drawGradientRect(x,y,w,h,c1,c2,vertical){
  const g=vertical?ctx.createLinearGradient(x,y,x,y+h):ctx.createLinearGradient(x,y,x+w,y);
  g.addColorStop(0,c1);g.addColorStop(1,c2);
  ctx.fillStyle=g;ctx.fillRect(x|0,y|0,w|0,h|0);
}

// ---------- Background: pseudo-3D vault corridor ----------
function drawVaultBg(offset){
  // deep background
  rect(0,0,W,H,C.bg0);
  // far wall gradient
  drawGradientRect(0,0,W,H,C.bg1,C.bg0,true);
  // water line
  const wl=H-70;
  drawGradientRect(0,wl,W,H-wl,C.water1,C.water0,true);
  // iron arches (3 layers of parallax)
  for(let layer=0;layer<3;layer++){
    const scale=1-layer*0.28;
    const par=offset*(0.3+layer*0.35);
    const yBase=H-40-layer*18;
    const archH=140*scale;
    const archW=110*scale;
    const cx=W/2+par;
    ctx.strokeStyle=layer===0?C.iron0:layer===1?C.iron1:C.iron2;
    ctx.lineWidth=layer===0?3:layer===1?2:1;
    // arch
    ctx.beginPath();
    ctx.moveTo(cx-archW/2,yBase);
    ctx.lineTo(cx-archW/2,yBase-archH*0.6);
    ctx.quadraticCurveTo(cx,yBase-archH*1.05,cx+archW/2,yBase-archH*0.6);
    ctx.lineTo(cx+archW/2,yBase);
    ctx.stroke();
    // vertical pillars
    ctx.beginPath();
    ctx.moveTo(cx-archW/2,yBase);ctx.lineTo(cx-archW/2,yBase+30);
    ctx.moveTo(cx+archW/2,yBase);ctx.lineTo(cx+archW/2,yBase+30);
    ctx.stroke();
  }
  // water reflection shimmer
  for(let i=0;i<40;i++){
    const x=(i*13+Math.sin(G.time*0.02+i)*8+offset*0.5)%W;
    const y=wl+((i*7)%(H-wl));
    px(x,y,C.water2);
  }
  // drips
  for(let i=0;i<3;i++){
    const t=(G.time*0.4+i*40)%120;
    const x=40+i*80;
    if(t<100)px(x,t,C.cyan1);
  }
}

// ---------- Title Screen ----------
function drawTitle(){
  drawVaultBg(0);
  // vignette
  const g=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,180);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.8)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // title glow
  ctx.shadowColor=C.glow2;ctx.shadowBlur=12;
  text('THE ASHEN VAULT',36,60,C.glow2,16);
  ctx.shadowBlur=0;
  text('— a memory puzzle —',70,84,C.iron2,8);
  // blinking prompt
  if(Math.floor(G.time/30)%2===0){
    text('PRESS ENTER / TAP TO DESCEND',40,150,C.amber2,8);
  }
  text('v1.0  ·  seven seals await',72,200,C.iron1,8);
}

// ---------- Hub ----------
function drawHub(){
  drawVaultBg(G.parallax);
  // corridor floor
  drawGradientRect(0,H-40,W,40,C.iron0,C.bg0,true);
  // seven doors, arranged in an arc (pseudo-3D perspective)
  for(let i=0;i<7;i++){
    const t=i-3;
    const dx=t*32+G.parallax*0.5;
    const depth=Math.abs(t);
    const scale=1-depth*0.08;
    const dw=26*scale, dh=48*scale;
    const x=W/2+dx-dw/2;
    const y=H-90-depth*4;
    const solved=i<G.sealsSolved;
    const isCurrent=i===G.sealsSolved;
    // door frame
    rect(x-2,y-2,dw+4,dh+4,C.iron0);
    // door body
    if(solved){
      drawGradientRect(x,y,dw,dh,C.glow0,C.glow1,true);
    }else if(isCurrent){
      const pulse=Math.sin(G.time*0.1)*0.2+0.8;
      ctx.globalAlpha=pulse;
      drawGradientRect(x,y,dw,dh,C.amber0,C.amber1,true);
      ctx.globalAlpha=1;
    }else{
      drawGradientRect(x,y,dw,dh,C.iron0,C.iron1,true);
    }
    // seal number
    ctx.fillStyle=solved?C.glow2:isCurrent?C.amber2:C.iron2;
    ctx.font='6px monospace';
    ctx.textAlign='center';
    ctx.fillText((i+1).toString(),x+dw/2,y+dh/2-3);
    ctx.textAlign='left';
    // lock icon if unsolved
    if(!solved){
      ctx.strokeStyle=isCurrent?C.amber2:C.iron2;
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.arc(x+dw/2,y+dh/2+6,3,Math.PI,0);
      ctx.stroke();
      rect(x+dw/2-4,y+dh/2+6,8,6,isCurrent?C.amber1:C.iron1);
    }
  }
  // player indicator (small figure)
  const px_=W/2+G.parallax*0.5;
  const py_=H-50;
  rect(px_-2,py_-8,4,8,C.bone2);
  rect(px_-2,py_-12,4,4,C.bone1);
  // HUD
  text('SEALS: '+G.sealsSolved+' / 7',6,6,C.cyan2,8);
  text('CONDUIT ONLINE',W-90,6,C.glow2,8);
  // memory fragments
  if(G.memory.name)text('◆ NAME',6,18,C.glow2,8);
  if(G.memory.crime)text('◆ CRIME',6,28,C.red2,8);
  if(G.memory.truth)text('◆ TRUTH',6,38,C.amber2,8);
  // hint
  if(Math.floor(G.time/40)%2===0)
    text('◄ ► SELECT DOOR   ENTER TO ENTER',34,H-10,C.iron2,8);
}

// ---------- Seal Puzzles ----------
function drawSealScene(){
  drawVaultBg(0);
  const s=SEALS[G.currentSeal];
  // header
  drawGradientRect(0,0,W,24,C.iron0,C.iron1,true);
  text(s.name,6,6,C.amber2,10);
  text('SEAL '+(G.currentSeal+1)+'/7',W-60,8,C.iron2,8);
  // prompt
  const lines=wrapText(s.prompt,42);
  lines.forEach((l,i)=>text(l,10,34+i*11,C.bone2,8));
  // puzzle-specific
  if(s.type==='pattern')drawPatternPuzzle(s);
  else if(s.type==='valves')drawValvesPuzzle(s);
  else if(s.type==='memory')drawChoicePuzzle(s);
  else if(s.type==='balance')drawBalancePuzzle(s);
  else if(s.type==='code')drawCodePuzzle(s);
  else if(s.type==='moral')drawChoicePuzzle(s);
  else if(s.type==='final')drawChoicePuzzle(s);
  // back
  text('[ESC] BACK',6,H-10,C.iron2,8);
}

let puzzle={};
function initPuzzle(s){
  puzzle={};
  if(s.type==='pattern'){puzzle.dials=[0,0,0,0];puzzle.sel=0;}
  if(s.type==='valves'){puzzle.valves=[0,0,0,0,0];puzzle.sel=0;}
  if(s.type==='balance'){puzzle.weights=[1,1,1];puzzle.sel=0;}
  if(s.type==='code'){puzzle.code='';}
  puzzle.msg='';puzzle.msgT=0;
  puzzle.solved=false;
}

function checkPuzzle(s){
  if(s.type==='pattern'){
    if(JSON.stringify(puzzle.dials)===JSON.stringify(s.solution))return true;
  }
  if(s.type==='valves'){
    if(JSON.stringify(puzzle.valves)===JSON.stringify(s.solution))return true;
  }
  if(s.type==='balance'){
    // sum of left two weights equals solution[0], etc — simplified: weights match
    if(JSON.stringify(puzzle.weights)===JSON.stringify(s.solution))return true;
  }
  if(s.type==='code'){
    if(puzzle.code===s.code)return true;
  }
  return false;
}

function drawPatternPuzzle(s){
  const baseY=90;
  for(let i=0;i<4;i++){
    const x=40+i*48;
    const v=puzzle.dials[i];
    const sel=puzzle.sel===i;
    // dial frame
    ctx.strokeStyle=sel?C.amber2:C.iron2;
    ctx.lineWidth=sel?2:1;
    ctx.strokeRect(x-14,baseY-14,28,28);
    // dial value
    const colors=[C.iron1,C.rust0,C.rust2,C.glow1];
    rect(x-10,baseY-10,20,20,colors[v]);
    // digit
    ctx.fillStyle=C.white;ctx.font='12px monospace';ctx.textAlign='center';
    ctx.fillText(v.toString(),x,baseY-6);
    ctx.textAlign='left';
    // ticks
    for(let t=0;t<4;t++){
      const a=t*Math.PI/2-Math.PI/2;
      const tx=x+Math.cos(a)*16,ty=baseY+Math.sin(a)*16;
      px(tx,ty,C.iron2);
    }
  }
  text('◄ ► SELECT   ▲ ▼ CHANGE',60,140,C.bone1,8);
  text('ENTER TO TEST',86,154,C.bone1,8);
  if(puzzle.msgT>0){text(puzzle.msg,W/2-30,170,C.red2,8);}
}

function drawValvesPuzzle(s){
  for(let i=0;i<5;i++){
    const x=30+i*40;
    const open=puzzle.valves[i];
    const sel=puzzle.sel===i;
    // pipe
    rect(x,100,30,10,C.iron1);
    // valve
    ctx.strokeStyle=sel?C.amber2:C.iron2;
    ctx.lineWidth=sel?2:1;
    ctx.strokeRect(x+6,90,18,18);
    // handle
    rect(x+13,96,4,6,open?C.glow1:C.red1);
    // water
    if(open)rect(x,103,30,4,C.cyan1);
  }
  text('◄ ► SELECT   ENTER TOGGLE',56,140,C.bone1,8);
  if(puzzle.msgT>0){text(puzzle.msg,W/2-30,170,C.red2,8);}
}

function drawChoicePuzzle(s){
  const choices=s.choices;
  for(let i=0;i<choices.length;i++){
    const y=90+i*20;
    const sel=puzzle.sel===i;
    if(sel){rect(36,y-2,W-72,16,C.iron1);}
    text((sel?'► ':'  ')+choices[i],40,y,C.bone2,10);
  }
  text('◄ ► SELECT   ENTER TO ANSWER',56,180,C.bone1,8);
  if(puzzle.msgT>0){text(puzzle.msg,W/2-30,200,C.red2,8);}
}

function drawBalancePuzzle(s){
  // scale visualization
  const cx=W/2,cy=110;
  const leftSum=puzzle.weights[0]+puzzle.weights[1];
  const rightSum=puzzle.weights[2];
  const tilt=Math.max(-1,Math.min(1,(rightSum-leftSum)*0.5));
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(tilt*0.3);
  // beam
  ctx.strokeStyle=C.iron2;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-50,0);ctx.lineTo(50,0);ctx.stroke();
  // pans
  rect(-56,0,12,4,C.iron1);
  rect(44,0,12,4,C.iron1);
  ctx.restore();
  // weights
  for(let i=0;i<3;i++){
    const x=60+i*50,y=160;
    const sel=puzzle.sel===i;
    ctx.strokeStyle=sel?C.amber2:C.iron2;
    ctx.lineWidth=sel?2:1;
    ctx.strokeRect(x-12,y-12,24,24);
    ctx.fillStyle=C.rust2;ctx.font='12px monospace';ctx.textAlign='center';
    ctx.fillText(puzzle.weights[i].toString(),x,y-4);
    ctx.textAlign='left';
  }
  text('◄ ► SELECT   ▲ ▼ WEIGHT',56,190,C.bone1,8);
  text('ENTER TO PLACE',86,202,C.bone1,8);
}

function drawCodePuzzle(s){
  // keypad
  const x0=88,y0=90;
  for(let i=0;i<9;i++){
    const x=x0+(i%3)*24,y=y0+Math.floor(i/3)*24;
    rect(x,y,20,20,C.iron1);
    ctx.strokeStyle=C.iron2;ctx.lineWidth=1;
    ctx.strokeRect(x,y,20,20);
    ctx.fillStyle=C.bone2;ctx.font='10px monospace';ctx.textAlign='center';
    ctx.fillText((i+1).toString(),x+10,y+6);
    ctx.textAlign='left';
  }
  rect(x0+72,y0,20,20,C.iron1);ctx.strokeRect(x0+72,y0,20,20);
  ctx.fillStyle=C.bone2;ctx.font='10px monospace';ctx.textAlign='center';
  ctx.fillText('0',x0+82,y0+6);ctx.textAlign='left';
  // display
  rect(88,64,72,18,C.black);
  ctx.strokeStyle=C.glow1;ctx.strokeRect(88,64,72,18);
  ctx.fillStyle=C.glow2;ctx.font='12px monospace';ctx.textAlign='center';
  ctx.fillText(puzzle.code.padEnd(4,'_'),124,68);
  ctx.textAlign='left';
  text('TAP DIGITS   [BACKSPACE] CLEAR',60,180,C.bone1,8);
  if(puzzle.msgT>0){text(puzzle.msg,W/2-30,196,C.red2,8);}
}

// ---------- Dialogue drawing ----------
function drawDialogue(){
  drawVaultBg(0);
  // dim
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
  const line=G.dialogue[G.dialogueIndex];
  // portrait box
  drawGradientRect(8,8,W-16,40,C.iron0,C.iron1,true);
  ctx.strokeStyle=C.amber1;ctx.lineWidth=1;ctx.strokeRect(8,8,W-16,40);
  // speaker
  ctx.fillStyle=line.who==='CONDUIT'?C.glow2:line.who==='MEMORY'?C.amber2:C.cyan2;
  ctx.font='10px monospace';ctx.textAlign='left';
  ctx.fillText(line.who,16,14);
  // text box
  drawGradientRect(8,H-70,W-16,62,C.black,C.iron0,true);
  ctx.strokeStyle=C.iron2;ctx.strokeRect(8,H-70,W-16,62);
  // wrapped text with typewriter
  const full=line.text.slice(0,G.dialogueChars);
  const lines=wrapText(full,42);
  ctx.fillStyle=C.white;ctx.font='8px monospace';
  lines.forEach((l,i)=>ctx.fillText(l,16,H-62+i*12));
  // next arrow
  if(G.dialogueChars>=line.text.length&&Math.floor(G.time/20)%2===0){
    ctx.fillStyle=C.amber2;ctx.beginPath();
    ctx.moveTo(W-20,H-16);ctx.lineTo(W-14,H-16);ctx.lineTo(W-17,H-11);
    ctx.fill();
  }
}
