<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chrono Weaver</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }
        #lang-btn {
            position: fixed; top: 10px; right: 10px; z-index: 100;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; padding: 6px 12px; border-radius: 20px; font-family: sans-serif;
            font-size: 14px; cursor: pointer; backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <button id="lang-btn">RU</button>
    <canvas id="game"></canvas>
    <script>
        // === RESIZE BOILERPLATE ===
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        // === I18N ===
        const i18n = {
            en: { title: "Chrono Weaver", score: "Score", best: "Best", play: "Play", gameover: "Game Over", restart: "Tap to Restart", combo: "Combo" },
            ru: { title: "Хроно-Ткач", score: "Счёт", best: "Рекорд", play: "Играть", gameover: "Игра окончена", restart: "Тап для рестарта", combo: "Комбо" }
        };
        const getLang = () => localStorage.getItem('lang') || 'en';
        const setLang = (l) => { localStorage.setItem('lang', l); updateUI(); };
        const t = (key) => i18n[getLang()][key] || i18n.en[key] || key;
        const toggleLang = () => setLang(getLang() === 'en' ? 'ru' : 'en');
        document.getElementById('lang-btn').addEventListener('click', toggleLang);
        function updateUI() {
            document.getElementById('lang-btn').textContent = getLang() === 'en' ? 'RU' : 'EN';
        }
        updateUI();

        // === UNIFIED INPUT ===
        const input = { up: false, down: false, left: false, right: false, action: false, tapped: false };
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' || e.key === 'w') input.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') input.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
            if (e.key === ' ' || e.key === 'Enter') { input.action = true; input.tapped = true; }
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowUp' || e.key === 'w') input.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') input.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
            if (e.key === ' ' || e.key === 'Enter') input.action = false;
        });
        canvas.addEventListener('touchstart', e => { e.preventDefault(); input.action = true; input.tapped = true; }, { passive: false });
        canvas.addEventListener('touchend', e => { e.preventDefault(); input.action = false; }, { passive: false });
        canvas.addEventListener('mousedown', e => { e.preventDefault(); input.action = true; input.tapped = true; });
        canvas.addEventListener('mouseup', e => { e.preventDefault(); input.action = false; });

        // === GAME STATE ===
        let state = 'start'; // start, playing, gameover
        let score = 0;
        let best = parseInt(localStorage.getItem('chronoBest')) || 0;
        let combo = 0;
        let comboTimer = 0;
        let timeScale = 1;
        let slowMoTimer = 0;
        let particles = [];
        let nodes = [];
        let anomalies = [];
        let threads = [];
        let spawnTimer = 0;
        let anomalyTimer = 0;
        let difficulty = 1;
        let gameTime = 0;
        let anchor = null; // { x, y, node }
        let weavePath = [];
        let screenShake = 0;

        const W = () => canvas.width / (window.devicePixelRatio || 1);
        const H = () => canvas.height / (window.devicePixelRatio || 1);

        // === PARTICLE SYSTEM ===
        class Particle {
            constructor(x, y, color, speed = 200, life = 0.6, size = 3) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * speed;
                this.vy = (Math.random() - 0.5) * speed;
                this.life = life; this.maxLife = life;
                this.color = color; this.size = size;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.life -= dt;
            }
            draw(ctx) {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.globalAlpha = alpha;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
        }

        function spawnParticles(x, y, color, count = 12, speed = 250) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, speed));
            }
        }

        // === NODE ===
        class Node {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.radius = 18;
                this.pulse = Math.random() * Math.PI * 2;
                this.active = true;
                this.color = `hsl(${180 + Math.random() * 60}, 100%, 60%)`;
            }
            update(dt) {
                this.pulse += dt * 3;
            }
            draw(ctx) {
                const r = this.radius + Math.sin(this.pulse) * 3;
                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 2.5);
                grad.addColorStop(0, this.color);
                grad.addColorStop(0.4, this.color.replace('60%', '30%'));
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, r * 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 25;
                ctx.shadowColor = this.color;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, r * 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // === ANOMALY ===
        class Anomaly {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.radius = 25;
                this.angle = 0;
                this.speed = 80 + Math.random() * 100;
                this.drift = (Math.random() - 0.5) * 60;
                this.color = '#ff3366';
            }
            update(dt) {
                this.y += this.speed * dt * timeScale;
                this.x += Math.sin(this.angle) * this.drift * dt;
                this.angle += dt * 2;
                this.radius = 25 + Math.sin(this.angle) * 5;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.shadowBlur = 30;
                ctx.shadowColor = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2;
                    const r = this.radius;
                    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
                ctx.shadowBlur = 0;
            }
        }

        // === THREAD ===
        class Thread {
            constructor(from, to, color) {
                this.from = { ...from };
                this.to = { ...to };
                this.color = color;
                this.life = 1;
                this.width = 4;
            }
            update(dt) {
                this.life -= dt * 1.5;
            }
            draw(ctx) {
                if (this.life <= 0) return;
                ctx.globalAlpha = this.life;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.width * this.life;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.moveTo(this.from.x, this.from.y);
                ctx.lineTo(this.to.x, this.to.y);
                ctx.stroke();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
        }

        // === BACKGROUND ===
        let stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 20 + 5,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function drawBackground(dt) {
            const grad = ctx.createLinearGradient(0, 0, 0, H());
            grad.addColorStop(0, '#0a0a1a');
            grad.addColorStop(0.5, '#0d0d2b');
            grad.addColorStop(1, '#050510');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W(), H());

            stars.forEach(s => {
                s.y += s.speed * dt * timeScale;
                if (s.y > H()) { s.y = -5; s.x = Math.random() * W(); }
                ctx.globalAlpha = s.alpha;
                ctx.fillStyle = '#88ccff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        // === GAME FUNCTIONS ===
        function resetGame() {
            score = 0;
            combo = 0;
            comboTimer = 0;
            timeScale = 1;
            slowMoTimer = 0;
            particles = [];
            nodes = [];
            anomalies = [];
            threads = [];
            spawnTimer = 0;
            anomalyTimer = 0;
            difficulty = 1;
            gameTime = 0;
            anchor = null;
            weavePath = [];
            screenShake = 0;
            for (let i = 0; i < 3; i++) {
                nodes.push(new Node(W() * (0.2 + Math.random() * 0.6), H() * (0.3 + Math.random() * 0.4)));
            }
        }

        function startGame() {
            resetGame();
            state = 'playing';
        }

        function gameOver() {
            state = 'gameover';
            if (score > best) {
                best = score;
                localStorage.setItem('chronoBest', best);
            }
            spawnParticles(W() / 2, H() / 2, '#ff3366', 40, 400);
        }

        function handleTap() {
            if (state === 'start' || state === 'gameover') {
                startGame();
                return;
            }
            if (state !== 'playing') return;

            if (!anchor) {
                // Find nearest node to tap
                let nearest = null;
                let minDist = 100;
                nodes.forEach(n => {
                    const d = Math.hypot(n.x - W() / 2, n.y - H() / 2);
                    if (d < minDist) { minDist = d; nearest = n; }
                });
                // Use tap position (center for simplicity)
                const tapX = W() / 2;
                const tapY = H() / 2;
                let closest = null;
                let closestDist = 120;
                nodes.forEach(n => {
                    const d = Math.hypot(n.x - tapX, n.y - tapY);
                    if (d < closestDist) { closestDist = d; closest = n; }
                });
                if (closest) {
                    anchor = { x: closest.x, y: closest.y, node: closest };
                    closest.active = false;
                    weavePath = [{ x: closest.x, y: closest.y }];
                    spawnParticles(closest.x, closest.y, closest.color, 8, 150);
                    nodes = nodes.filter(n => n !== closest);
                }
            } else {
                // Release anchor - find target node
                let target = null;
                let minDist = 200;
                nodes.forEach(n => {
                    const d = Math.hypot(n.x - anchor.x, n.y - anchor.y);
                    if (d < minDist) { minDist = d; target = n; }
                });
                if (target) {
                    threads.push(new Thread(anchor, target, target.color));
                    spawnParticles(target.x, target.y, target.color, 15, 250);
                    nodes = nodes.filter(n => n !== target);
                    combo++;
                    comboTimer = 1.5;
                    score += 10 * combo;
                    timeScale = Math.max(0.3, 1 - combo * 0.05);
                    slowMoTimer = 2;
                    // Spawn new node
                    for (let i = 0; i < 2; i++) {
                        nodes.push(new Node(
                            W() * (0.15 + Math.random() * 0.7),
                            H() * (0.15 + Math.random() * 0.7)
                        ));
                    }
                    anchor = null;
                    weavePath = [];
                } else {
                    // Failed - break combo
                    combo = 0;
                    timeScale = 1;
                    anchor = null;
                    weavePath = [];
                    screenShake = 10;
                    spawnParticles(anchor ? anchor.x : W() / 2, anchor ? anchor.y : H() / 2, '#ff3366', 20, 300);
                }
            }
        }

        // === UPDATE ===
        function update(dt) {
            if (state !== 'playing') {
                particles.forEach(p => p.update(dt));
                particles = particles.filter(p => p.life > 0);
                return;
            }

            gameTime += dt;
            difficulty = 1 + gameTime * 0.05;

            // Slow motion timer
            if (slowMoTimer > 0) {
                slowMoTimer -= dt;
                timeScale = Math.max(0.3, timeScale);
            } else {
                timeScale += (1 - timeScale) * dt * 2;
            }

            // Combo timer
            if (comboTimer > 0) {
                comboTimer -= dt;
                if (comboTimer <= 0) {
                    combo = 0;
                    timeScale = 1;
                }
            }

            // Update nodes
            nodes.forEach(n => n.update(dt));

            // Spawn nodes
            spawnTimer -= dt;
            if (spawnTimer <= 0 && nodes.length < 8) {
                nodes.push(new Node(
                    W() * (0.1 + Math.random() * 0.8),
                    H() * (0.1 + Math.random() * 0.8)
                ));
                spawnTimer = Math.max(0.3, 1.2 - difficulty * 0.1);
            }

            // Spawn anomalies
            anomalyTimer -= dt;
            if (anomalyTimer <= 0) {
                anomalies.push(new Anomaly(
                    W() * (0.1 + Math.random() * 0.8),
                    -50
                ));
                anomalyTimer = Math.max(0.5, 2.5 - difficulty * 0.2);
            }

            // Update anomalies
            anomalies.forEach(a => a.update(dt));
            anomalies = anomalies.filter(a => a.y < H() + 100);

            // Update threads
            threads.forEach(t => t.update(dt));
            threads = threads.filter(t => t.life > 0);

            // Update particles
            particles.forEach(p => p.update(dt));
            particles = particles.filter(p => p.life > 0);

            // Check collision with anomalies
            anomalies.forEach(a => {
                // Check if anomaly hits any node
                nodes.forEach(n => {
                    if (Math.hypot(n.x - a.x, n.y - a.y) < a.radius + n.radius) {
                        n.active = false;
                        spawnParticles(n.x, n.y, '#ff3366', 15, 200);
                        screenShake = 8;
                    }
                });
                nodes = nodes.filter(n => n.active);

                // Check if anomaly hits anchor
                if (anchor) {
                    if (Math.hypot(anchor.x - a.x, anchor.y - a.y) < a.radius + 20) {
                        anchor = null;
                        weavePath = [];
                        combo = 0;
                        screenShake = 15;
                        spawnParticles(a.x, a.y, '#ff3366', 25, 350);
                    }
                }
            });

            // Check if anchor exists but no nodes nearby
            if (anchor && nodes.length === 0) {
                anchor = null;
                weavePath = [];
            }

            // Screen shake
            if (screenShake > 0) {
                screenShake -= dt * 30;
                if (screenShake < 0) screenShake = 0;
            }

            // Game over if no nodes and no anchor
            if (nodes.length === 0 && !anchor && state === 'playing') {
                gameOver();
            }
        }

        // === DRAW ===
        function draw() {
            ctx.save();
            if (screenShake > 0) {
                ctx.translate(
                    (Math.random() - 0.5) * screenShake,
                    (Math.random() - 0.5) * screenShake
                );
            }

            drawBackground(1 / 60);

            // Draw threads
            threads.forEach(t => t.draw(ctx));

            // Draw weave path
            if (anchor && weavePath.length > 0) {
                ctx.strokeStyle = anchor.node ? anchor.node.color : '#00ffff';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 20;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.beginPath();
                ctx.moveTo(weavePath[0].x, weavePath[0].y);
                for (let i = 1; i < weavePath.length; i++) {
                    ctx.lineTo(weavePath[i].x, weavePath[i].y);
                }
                ctx.lineTo(W() / 2, H() / 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Draw nodes
            nodes.forEach(n => n.draw(ctx));

            // Draw anomalies
            anomalies.forEach(a => a.draw(ctx));

            // Draw anchor
            if (anchor) {
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ffffff';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(anchor.x, anchor.y, 25 + Math.sin(gameTime * 10) * 5, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Draw particles
            particles.forEach(p => p.draw(ctx));

            // Draw UI
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(t('score') + ': ' + score, 20, 40);
            ctx.font = '16px sans-serif';
            ctx.fillStyle = '#88ccff';
            ctx.fillText(t('best') + ': ' + best, 20, 65);

            if (combo > 1) {
                ctx.textAlign = 'right';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillStyle = '#ffcc00';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffcc00';
                ctx.fillText(t('combo') + ' x' + combo, W() - 20, 40);
                ctx.shadowBlur = 0;
            }

            // Draw start/gameover screens
            if (state === 'start') {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W(), H());
                ctx.textAlign = 'center';
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#00ffff';
                ctx.fillStyle = '#00ffff';
                ctx.font = 'bold 48px sans-serif';
                ctx.fillText(t('title'), W() / 2, H() / 2 - 40);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = '20px sans-serif';
                ctx.fillText(t('play'), W() / 2, H() / 2 + 30);
                ctx.font = '14px sans-serif';
                ctx.fillStyle = '#888888';
                ctx.fillText('Tap / Space', W() / 2, H() / 2 + 60);
            }

            if (state === 'gameover') {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, W(), H());
                ctx.textAlign = 'center';
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ff3366';
                ctx.fillStyle = '#ff3366';
                ctx.font = 'bold 48px sans-serif';
                ctx.fillText(t('gameover'), W() / 2, H() / 2 - 40);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = '24px sans-serif';
                ctx.fillText(t('score') + ': ' + score, W() / 2, H() / 2 + 20);
                ctx.fillStyle = '#ffcc00';
                ctx.font = '18px sans-serif';
                ctx.fillText(t('best') + ': ' + best, W() / 2, H() / 2 + 55);
                ctx.fillStyle = '#888888';
                ctx.font = '16px sans-serif';
                ctx.fillText(t('restart'), W() / 2, H() / 2 + 100);
            }

            ctx.restore();
        }

        // === GAME LOOP ===
        let lastTime = performance.now();
        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            if (input.tapped) {
                handleTap();
                input.tapped = false;
            }

            update(dt);
            draw();

            requestAnimationFrame(gameLoop);
        }

        // Initialize
        resetGame();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
